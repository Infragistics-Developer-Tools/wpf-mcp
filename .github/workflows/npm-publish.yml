name: Publish (npm + NuGet + MCP Registry)
on:
  release:
    types: [created]

# Nothing by default; each job asks for exactly what it needs.
permissions: {}

concurrency:
  group: release-${{ github.ref_name }}

env:
  VERSION: ${{ github.ref_name }}

jobs:
  # Generates the data set from scratch (nothing under src/data is committed), builds
  # both servers, tests, validates and packs the npm tarball and the NuGet package.
  # Windows only because of the type extractor. No publishing rights.
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - run: echo "Releasing ${VERSION}"

      - uses: ./.github/actions/build-data
        with:
          nuget-feed-url: ${{ secrets.NUGET_FEED_URL }}
          nuget-feed-username: ${{ secrets.NUGET_FEED_USERNAME }}
          nuget-feed-password: ${{ secrets.NUGET_FEED_PASSWORD }}
          package-version: ${{ env.VERSION }}

      - name: Validate package contents
        run: npm run validate:package -- --expected-version "$VERSION"

      - name: Pack
        run: npm pack

      - uses: actions/upload-artifact@v7
        with:
          name: package
          path: "*.tgz"
          if-no-files-found: error
          retention-days: 5

      - uses: actions/upload-artifact@v7
        with:
          name: nupkg
          path: "nupkg/*.nupkg"
          if-no-files-found: error
          retention-days: 5

  # Publishes exactly the tarball that was validated above — this job cannot rebuild.
  # ubuntu so the npm/OIDC steps stay identical to igniteui-cli.
  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - uses: actions/download-artifact@v8
        with:
          name: package

      - name: Define npm tag
        run: |
          if [[ ${VERSION} == *"alpha"* || ${VERSION} == *"beta"* || ${VERSION} == *"rc"* ]]; then
            NPM_TAG=next
          else
            NPM_TAG=latest
          fi
          echo "NPM_TAG=$NPM_TAG" >> $GITHUB_ENV
          echo "$NPM_TAG"

      # Trusted publishing (OIDC): no NPM_TOKEN. The package must be configured on
      # npmjs.com with this repository and workflow file as its trusted publisher.
      - name: Publish package
        run: npm publish ./*.tgz --tag ${NPM_TAG} --provenance

  # Publishes exactly the nupkg that was validated above. Same shape as
  # IgniteUI/igniteui-blazor's release workflow: gated behind the nuget-org-publish
  # environment, and nuget.org trusted publishing (OIDC) instead of a stored API key —
  # NuGet/login exchanges the workflow's OIDC token for a short-lived key under the
  # nuget.org account named by INFRAGISTICS_NUGET_ORG_USER (the account that owns the
  # trust policy and the Infragistics.* prefix). No --skip-duplicate: nuget.org never
  # accepts a version twice, and a rerun should fail loudly rather than pretend it shipped.
  publish-nuget:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: nuget-org-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - uses: actions/download-artifact@v8
        with:
          name: nupkg
          path: nupkg

      - name: NuGet login (OIDC Trusted Publishing)
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: ${{ secrets.INFRAGISTICS_NUGET_ORG_USER }}

      - name: Publish to NuGet.org
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push nupkg/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json

  # MCP Registry. Skipped for prereleases — the registry has no dist-tag equivalent, so
  # publishing an alpha/beta/rc would make it the current version. mcp-publisher validates
  # every server.json package against its registry, so it runs after both pushes and
  # after nuget.org has indexed the nupkg (which lags a push by minutes).
  publish-mcp-registry:
    needs: [publish-npm, publish-nuget]
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      # Only for server.json, which mcp-publisher reads from the working directory.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Wait for nuget.org indexing
        run: |
          ID=$(node -p "require('./server.json').packages.find(p => p.registryType === 'nuget').identifier.toLowerCase()")
          URL="https://api.nuget.org/v3-flatcontainer/${ID}/${VERSION,,}/${ID}.nuspec"
          for i in $(seq 1 60); do
            if curl -fsSL -o /dev/null "$URL"; then echo "indexed: $URL"; exit 0; fi
            echo "not indexed yet ($i/60), waiting 20s…"; sleep 20
          done
          echo "::error::nuget.org did not index ${ID} ${VERSION} within 20 minutes"; exit 1

      - name: Download MCP Publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar -xz -f - mcp-publisher
          chmod +x mcp-publisher

      - name: Publish to MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
