name: Node.js CI
permissions:
  contents: read
  checks: write

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # Fast feedback that needs no data: tsc never touches src/data.
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  # The real thing: full data generation + build + smoke test + package validation.
  # windows-latest because scripts/type-extractor targets net8.0-windows and loads
  # WPF assemblies; nothing else in the pipeline needs Windows.
  build-and-test:
    runs-on: windows-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./.github/actions/build-data
        with:
          node-version: ${{ matrix.node-version }}
          nuget-feed-url: ${{ secrets.NUGET_FEED_URL }}
          nuget-feed-username: ${{ secrets.NUGET_FEED_USERNAME }}
          nuget-feed-password: ${{ secrets.NUGET_FEED_PASSWORD }}
      - name: Validate package contents
        shell: bash
        run: npm run validate:package
      - name: Report package size
        shell: bash
        run: npm pack --dry-run 2>&1 | grep -E "package size|unpacked size|total files"
