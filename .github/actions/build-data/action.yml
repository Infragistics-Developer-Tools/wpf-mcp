name: Build data and package
description: >
  Restores the Infragistics NuGet packages, runs the full data pipeline
  (type extractor → API → docs → themes), compiles both servers (Node and
  C#), runs the smoke test against each and the cross-runtime parity test,
  then packs the NuGet package into nupkg/. Windows only — the type extractor
  loads WPF assemblies. Shared by nodejs.yml, dotnet-ci.yml and
  nuget-publish.yml so CI and the release can never drift.

inputs:
  node-version:
    description: Node.js version
    default: "24"
  nuget-feed-url:
    description: Infragistics private NuGet feed (v3 index URL). Empty restores from nuget.org.
    default: ""
  nuget-feed-username:
    description: Username for the private feed
    default: ""
  nuget-feed-password:
    description: Password / API key for the private feed
    default: ""
  package-version:
    description: Version stamped into the NuGet package (the release tag). Defaults to package.json's.
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm

    # 10.0.x builds everything (global.json pins it): the server (net10.0) and the
    # build-time type extractor (net10.0-windows).
    - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: 10.0.x

    # nuget/nuget.config is gitignored; it is written here only when the feed
    # secrets are present (they are not on pull requests from forks, which then
    # restore the public Trial packages from nuget.org). Credentials are left as
    # %ENV% placeholders that NuGet expands at restore time, so they never touch
    # disk or the log.
    - name: Configure private NuGet feed
      if: inputs.nuget-feed-url != ''
      shell: bash
      env:
        NUGET_FEED_URL: ${{ inputs.nuget-feed-url }}
      run: |
        cat > nuget/nuget.config <<XML
        <?xml version="1.0" encoding="utf-8"?>
        <configuration>
          <packageSources>
            <clear />
            <add key="infragistics" value="${NUGET_FEED_URL}" />
            <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
          </packageSources>
          <packageSourceCredentials>
            <infragistics>
              <add key="Username" value="%NUGET_FEED_USERNAME%" />
              <add key="ClearTextPassword" value="%NUGET_FEED_PASSWORD%" />
            </infragistics>
          </packageSourceCredentials>
          <packageSourceMapping>
            <packageSource key="infragistics">
              <package pattern="Infragistics.*" />
            </packageSource>
            <packageSource key="nuget.org">
              <package pattern="*" />
            </packageSource>
          </packageSourceMapping>
        </configuration>
        XML
        echo "Restoring Infragistics.* from the private feed, everything else from nuget.org"

    # The restore is the slowest step by far (88 packages). Keyed on the csproj so
    # a version bump is the only thing that invalidates it.
    - name: Cache NuGet packages
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('nuget/WpfDocs.csproj') }}

    # The extractor's output depends only on the packages and its own source;
    # scripts/generate.ts skips the dotnet run when this file is newer than both.
    - name: Cache extracted type info
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: nuget/type-info.json
        key: type-info-${{ runner.os }}-${{ hashFiles('nuget/WpfDocs.csproj', 'scripts/type-extractor/**') }}

    - name: Install packages
      shell: bash
      run: npm ci

    - name: Type-check
      shell: bash
      run: npm run typecheck

    - name: Build data and server
      shell: bash
      env:
        NUGET_FEED_USERNAME: ${{ inputs.nuget-feed-username }}
        NUGET_FEED_PASSWORD: ${{ inputs.nuget-feed-password }}
      run: npm run build:all

    - name: Smoke test
      shell: bash
      run: npm test

    # The C# server reads the same src/data; the parity test proves both runtimes
    # return byte-identical tool output so either package can be installed.
    - name: Build C# server
      shell: bash
      run: npm run build:dotnet

    - name: Smoke test (C#)
      shell: bash
      run: npm run test:dotnet

    - name: Parity test (Node vs C#)
      shell: bash
      run: npm run test:parity

    # Unsigned: nuget-publish.yml Authenticode-signs this nupkg (and wpf-mcp.dll
    # inside it) in a separate job that holds the Azure access this one never gets.
    - name: Pack NuGet package
      shell: bash
      run: npm run pack:dotnet -- --version "${{ inputs.package-version }}"
